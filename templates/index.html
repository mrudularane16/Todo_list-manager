<!DOCTYPE html>
<html>
<head>
    <title>To Do Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>My To Do List</h1>

    <form action="/add" method="POST">

        <input
            type="text"
            name="task"
            placeholder="Enter task"
            required
        >

        <select name="priority">

            <option>High</option>
            <option>Medium</option>
            <option>Low</option>

        </select>

        <input
            type="date"
            name="due_date"
            required
        >

        <button type="submit">
            Add Task
        </button>

    </form>

    <form method="GET">

        <input
            type="text"
            name="search"
            placeholder="Search task..."
            value="{{ search }}"
        >

        <button>
            Search
        </button>

    </form>

    <div class="notebook">

        {% for task in tasks %}

        <div class="task-line">

            <input
                type="checkbox"
                onchange="location.href='/complete/{{task.id}}'"
                {% if task.status == "Completed" %}
                checked
                {% endif %}
            >

            <span
            class="
            {% if task.status == 'Completed' %}
            completed
            {% endif %}
            ">
                {{ task.task }}
            </span>

            <span class="priority">
                {{ task.priority }}
            </span>

            <span class="date">
                {{ task.due_date }}
            </span>

            <a href="/edit/{{task.id}}">
                Edit
            </a>

            <a href="/delete/{{task.id}}">
                Delete
            </a>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
