<!DOCTYPE html>
<html>
<head>

<title>Edit Task</title>

<link
rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

<div class="container">

<h1>Edit Task</h1>

<form action="/update/{{task.id}}" method="POST">

<input
type="text"
name="task"
value="{{task.task}}"
required
>

<select name="priority">

<option
{% if task.priority=="High" %}
selected
{% endif %}
>
High
</option>

<option
{% if task.priority=="Medium" %}
selected
{% endif %}
>
Medium
</option>

<option
{% if task.priority=="Low" %}
selected
{% endif %}
>
Low
</option>

</select>

<input
type="date"
name="due_date"
value="{{task.due_date}}"
required
>

<button type="submit">
Update
</button>

</form>

</div>

</body>
</html>
